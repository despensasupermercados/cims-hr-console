name: deploy-production
# Manual PRODUCTION deploy. Run from the Actions tab ("Run workflow").
# Mirrors deploy-staging.yml but targets production: runs the test gate,
# applies PRODUCTION D1 migrations, deploys the Worker.
# Uses the same repo secrets deploy-staging already uses:
#   CLOUDFLARE_API_TOKEN   - "Workers Scripts: Edit" + "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account id
# Manual-only on purpose: nothing here can fire on a push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a PRODUCTION deploy.'
        required: true
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Test + migrate production + deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
