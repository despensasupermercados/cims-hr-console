name: nightly-self-maintenance
# Repair-only guardian: health-check and fix what is broken. Explicitly NO
# feature-building. Requires repo secret ANTHROPIC_API_KEY. Honors CLAUDE.md rules:
# money/auth/schema changes are PRs for Miguel, never auto-merges.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write          # required by claude-code-action to fetch its OIDC token

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run test gate (record current health)
        run: npm test || echo "TESTS_RED" >> $GITHUB_ENV
      - name: Agent health-check + repair
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The standing brief. The agent must obey CLAUDE.md.
          prompt: |
            You are the nightly REPAIR-ONLY guardian for the CIMS HR Console. Follow CLAUDE.md strictly.
            Your sole mandate: health-check the system and fix only what is BROKEN. You must NOT
            build, extend, refactor, or improve any feature, UI, or code path that is working.
            No new endpoints, no new emails, no schema additions, no opportunistic changes.
            If nothing is broken, change nothing and open nothing except the digest.
            Do, in order:
            1. Run npm test. If red, open an issue titled "Nightly: test gate RED" with the
               failing cases and propose the minimal fix as a PR. Do not merge.
            2. Health-check the deployed worker: build status, endpoint availability, and
               email-send failures in mail_log. If something is down or failing, open an issue
               with the diagnosis and propose the minimal repair as a PR. Do not merge.
            3. Auto-timing heartbeat: the D1 table auto_send_run must contain a row whose
               run_at falls on YESTERDAY (UTC) with outcome disabled or ran - one row is
               written at every 08:00 Europe/Budapest gate run. A missing row means the
               hourly cron or the gate is dead: open an issue titled "Nightly: auto-timing
               heartbeat MISSING". An outcome digest_failed row means the mailer failed:
               flag it in the digest. Do not modify auto_send_log or auto_send_run.
            4. Check for DB drift (schema vs code expectations, orphan contracts, crew with no
               agency, counts that do not reconcile to history). Flag - never silently fix -
               anything money-affecting or crew-data-affecting.
            5. Anything touching money, auth, schema, or crew data -> open a PR addressed to
               Miguel with a written diagnosis and recommended fix. Never auto-merge anything.
            6. Post a <=5 line digest: checked / broken-found / fixed-via-PR / waiting-on-Miguel.
