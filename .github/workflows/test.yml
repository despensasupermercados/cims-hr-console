name: tests
# The deploy gate. Cloudflare Workers Builds also runs `npm test` via the deploy
# script, but this runs on every PR so red code can never reach a mergeable state.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # 15 Oct 2026: the Worker gained its first runtime dependency (xlsx, the SharePoint sync's parser), so the
      # tests need node_modules — before that nothing was installed here and `npm test` ran on bare Node.
      - run: npm ci
      - run: npm test
