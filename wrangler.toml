# cims-hr-console — Cloudflare Worker

name = "cims-hr-console"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# PREVIEW URLS: OFF. (2026-09-07)
# A build on a NON-production branch runs `wrangler versions upload`, which uploads a
# version of THIS worker — bound to the PRODUCTION D1, R2 and MAILER below — and, with
# preview URLs on, publishes it at a public
# `<version>-cims-hr-console.<subdomain>.workers.dev` address linked from the PR.
# That is unreviewed code reachable against real crew data and real bonus history.
#
# wrangler 3.x defaults preview URLs to ENABLED when this key is absent (the opt-in
# default only arrives in wrangler >= 4.34), so the absence of this line was the
# exposure, not a safe default. Supported since wrangler 3.91; we pin 3.114.
#
# This does NOT touch the production deployment or its routes — only routing to
# versioned/aliased preview URLs. Pinned by test/wrangler_config.test.js.
#
# Belt and braces: the other half of this is Cloudflare's Settings > Build >
# Branch control > "Builds for non-production branches", which stops the build from
# running at all (and saves the build minutes). That switch lives only in the
# dashboard/Builds API, not in this file. See docs/BRANCH_CONTROL.md.
preview_urls = false

# KEEP DASHBOARD VARIABLES (2026-09-15). Workers Builds runs `wrangler deploy` on every
# merge to main, and `wrangler deploy` DELETES every plain-text variable that was set in the
# Cloudflare dashboard unless this is true (secrets survive; vars do not). Without it a
# DEPLOY_TO typed into Settings > Variables is wiped by the next merge and the Deploy button
# refuses again with `no_recipient`. Pinned by test/wrangler_config.test.js.
keep_vars = true
# SMART PLACEMENT (13 Oct 2026, "it appears that is getting slower"). The D1 primary is in Prague (EEUR); the Worker
# ran at the colo nearest each user, so every SEQUENTIAL database round trip crossed the ocean: perf_log measured
# /api/crew/get 2.1s and /api/bonus/crew 2.3s from HKG against 0.85s from VIE for the same reads. Placed near the
# database, the user pays the long hop once per request instead of once per round trip.
[placement]
mode = "smart"

# DEPLOY GATE (2026-07-03 white-screen incident; patch retired 2026-09-04): wrangler runs
# this before every bundle/deploy, no matter how wrangler is invoked (Workers Builds,
# local, CI). It hard-verifies that every inline <script> the worker serves PARSES as
# JavaScript and fails the build otherwise. The source-repair half of the old hook is
# gone (the source has been fixed since July); test/client_script_syntax.test.js runs the
# same function under `npm test`, so CI and the deploy hook cannot drift apart.
[build]
command = "node scripts/verify_client_scripts.mjs"

# Weekly Seafarer Movements email recipient. The hourly cron (below) sends ONCE on
# Monday 07:00 America/New_York to this address. Kept here (not the dashboard) so it
# survives every CI deploy. Override per-environment if ever needed.
[vars]
MOVEMENTS_TO = "onboardsupport@dg3.com"
# Sender for ALL CIMS email (magic links, statements, movements). A real monitored
# address — NOT no-reply — to reduce corporate spam-filtering. Lives here so it survives
# worker.js overwrites; the worker reads env.MAIL_FROM.
MAIL_FROM = "CIMS <cims@cims.work>"
# Auto-timing rehearsal switch. "false" = the Keyman toggle is the SINGLE live switch:
# enabling it sends real crew email at T-14/T-7 (it auto-seeds in-window history on
# enable, so nobody is emailed retroactively). Set to "true" to rehearse instead:
# the daily digest reports what WOULD send, nothing goes to seafarers, nothing is logged.
AUTO_SEND_DRY_RUN = "false"
# Keyman Deploy recipient (src/keyman_deploy.js, 2026-09-15): the ONE email a card leaves the
# board on goes to Joy (Maryjoy Manzanares, DG3 Crew Admin, assists Rita and TDG, issues crew
# flights). Unset = the Deploy button refuses (`no_recipient`); it never defaults. DEPLOY_CC
# defaults to Rita in code. Lives here, not the dashboard, so it survives every deploy.
DEPLOY_TO = "maryjoy.manzanares@dg3.com"
# Printshop Audit (14 Oct 2026): who receives the pre-visit assessment and the filed audit. Miguel's list, verbatim
# ("he can go to Ray, Rolando, Ogi, Jonathan, and myself"). Never guessed in code; unset = the email is not sent.
AUDIT_TO = "Ray.Guerra@dg3.com, Rolando.Abellan@dg3.com, Ohji.Miranda@dg3.com, Jonathan.Alonzo@dg3.com, Miguel.Sanmartin@dg3.com"
# The request to the ship copies Rolando and Ray (the design's A4: "Cc John's personal email · Rolando · Ray"); replies
# reach Rolando, the first name here.
AUDIT_REQUEST_CC = "Rolando.Abellan@dg3.com, Ray.Guerra@dg3.com"
# AUDIT_LIVE: Miguel signed off the rendered audit emails on 14 Oct 2026 ("i am good with the emails"; CIMS email
# standard §5). Live = the request goes to the ship's printshop mailbox + a copy to the crew's personal email + Rolando and
# Ray, and the documents-in assessment to AUDIT_TO. Remove the line to fall back to TEST MODE (auditor only, [TEST]).
# Production only: the staging vars block does not carry it, and staging mail is locked to MAIL_ONLY_TO regardless.
AUDIT_LIVE = "true"

# Central transport — all email goes through cims-mailer (service binding).
# This worker builds content only; cims-mailer owns the Resend key,
# retries/outbox, and mail_log. See cims-mailer/docs/EMAIL-CONVENTION.md
[[services]]
binding = "MAILER"
service = "cims-mailer"

# Printshop Audit (14 Oct 2026): HON's own readers — the press register, OBP lines (the fresher copy), Pattern 43
# measured, the Machine Management List read — through HON's named entrypoint (cims-hon PR #113). Reachable only by
# this binding, never over HTTP; it stores nothing.
[[services]]
binding = "HON"
service = "cims-hon"
entrypoint = "AuditReader"

# DEPRECATED: the RESEND_API_KEY secret is no longer read by this worker — email
# delivery moved to the MAILER binding above. Delete the secret after verifying
# mail flows end-to-end:  wrangler secret delete RESEND_API_KEY
[ai]
binding = "AI"

# Hourly safety-net sweep of the crew-reports inbox (the email handler also processes on arrival).
[triggers]
crons = ["0 * * * *"]

# Production database (already live, holds the 97 crew).
[[d1_databases]]
binding = "DB"
database_name = "cims-hr-console"
database_id = "f0ac8b6a-deac-4214-8f42-e22b202d7d7d"
migrations_dir = "migrations"

# Daily Keyman board backup (spec §14.3). The hourly cron writes one dated CSV per day
# to this R2 bucket (off-D1 disaster-recovery snapshot). Free tier; a daily CSV is ~KB.
[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "cims-hr-exports"

# Printshop Audit files (14 Oct 2026): Pattern 43 bundles, Management Lists, audit photos. Created for the audit by
# Miguel's decision ("rather u create a cims audit file"); never mixed with the backups above.
[[r2_buckets]]
binding = "AUDIT_FILES"
bucket_name = "cims-audit-files"

# The ship mailboxes (cims-timecard's ship_contact, Brain recPHlvv1wzYOEFzg). READ ONLY by rule: the audit issues
# SELECT only against this binding (test/audit_guards.test.js) and it carries no migrations_dir, so no migration
# command in this repo can ever point at another app's database.
[[d1_databases]]
binding = "TIMECARD_DB"
database_name = "cims-timecard"
database_id = "ae52e15f-38f6-4969-ba0c-d94de9ecd8bd"

# ---- Staging: a separate Worker + separate D1 copy. Nothing reaches prod data
# that has not run green here first. Create the staging DB once with:
#   wrangler d1 create cims-hr-console-staging
# then paste its id below.
[env.staging]
name = "cims-hr-console-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cims-hr-console-staging"
database_id = "84ad4352-9979-4cd8-9bd2-fec887591257"
migrations_dir = "migrations"

# Staging gets a mailer for the audit's emails (14 Oct 2026) — and two locks with it, because wrangler INHERITS the
# hourly cron into this environment and the database here is a copy of production's crew:
#   1. no cron on staging at all (nothing runs on a timer against copied crew);
#   2. MAIL_ONLY_TO: every email to anyone else is dropped before it reaches the mailer (src/mail_guard.js).
# Pinned by test/wrangler_config.test.js: a staging MAILER without MAIL_ONLY_TO fails the suite.
[env.staging.triggers]
crons = []

[env.staging.vars]
MAIL_FROM = "CIMS <cims@cims.work>"
MAIL_ONLY_TO = "Miguel.Sanmartin@dg3.com"
AUDIT_TO = "Miguel.Sanmartin@dg3.com"

[[env.staging.services]]
binding = "MAILER"
service = "cims-mailer"

[[env.staging.services]]
binding = "HON"
service = "cims-hon"
entrypoint = "AuditReader"

[[env.staging.r2_buckets]]
binding = "AUDIT_FILES"
bucket_name = "cims-audit-files-staging"

[[env.staging.d1_databases]]
binding = "TIMECARD_DB"
database_name = "cims-timecard"
database_id = "ae52e15f-38f6-4969-ba0c-d94de9ecd8bd"
