# cims-hr-console — Cloudflare Worker

name = "cims-hr-console"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# PREVIEW URLS: OFF. (2026-09-07)
# A build on a NON-production branch runs `wrangler versions upload`, which uploads a
# version of THIS worker — bound to the PRODUCTION D1, R2 and MAILER below — and, with
# preview URLs on, publishes it at a public
# `<version>-cims-hr-console.<subdomain>.workers.dev` address linked from the PR.
# That is unreviewed code reachable against real crew data and real bonus history.
#
# wrangler 3.x defaults preview URLs to ENABLED when this key is absent (the opt-in
# default only arrives in wrangler >= 4.34), so the absence of this line was the
# exposure, not a safe default. Supported since wrangler 3.91; we pin 3.114.
#
# This does NOT touch the production deployment or its routes — only routing to
# versioned/aliased preview URLs. Pinned by test/wrangler_config.test.js.
#
# Belt and braces: the other half of this is Cloudflare's Settings > Build >
# Branch control > "Builds for non-production branches", which stops the build from
# running at all (and saves the build minutes). That switch lives only in the
# dashboard/Builds API, not in this file. See docs/BRANCH_CONTROL.md.
preview_urls = false

# DEPLOY GATE (2026-07-03 white-screen incident; patch retired 2026-09-04): wrangler runs
# this before every bundle/deploy, no matter how wrangler is invoked (Workers Builds,
# local, CI). It hard-verifies that every inline <script> the worker serves PARSES as
# JavaScript and fails the build otherwise. The source-repair half of the old hook is
# gone (the source has been fixed since July); test/client_script_syntax.test.js runs the
# same function under `npm test`, so CI and the deploy hook cannot drift apart.
[build]
command = "node scripts/verify_client_scripts.mjs"

# Weekly Seafarer Movements email recipient. The hourly cron (below) sends ONCE on
# Monday 07:00 America/New_York to this address. Kept here (not the dashboard) so it
# survives every CI deploy. Override per-environment if ever needed.
[vars]
MOVEMENTS_TO = "onboardsupport@dg3.com"
# Sender for ALL CIMS email (magic links, statements, movements). A real monitored
# address — NOT no-reply — to reduce corporate spam-filtering. Lives here so it survives
# worker.js overwrites; the worker reads env.MAIL_FROM.
MAIL_FROM = "CIMS <cims@cims.work>"
# Auto-timing rehearsal switch. "false" = the Keyman toggle is the SINGLE live switch:
# enabling it sends real crew email at T-14/T-7 (it auto-seeds in-window history on
# enable, so nobody is emailed retroactively). Set to "true" to rehearse instead:
# the daily digest reports what WOULD send, nothing goes to seafarers, nothing is logged.
AUTO_SEND_DRY_RUN = "false"

# Central transport — all email goes through cims-mailer (service binding).
# This worker builds content only; cims-mailer owns the Resend key,
# retries/outbox, and mail_log. See cims-mailer/docs/EMAIL-CONVENTION.md
[[services]]
binding = "MAILER"
service = "cims-mailer"

# DEPRECATED: the RESEND_API_KEY secret is no longer read by this worker — email
# delivery moved to the MAILER binding above. Delete the secret after verifying
# mail flows end-to-end:  wrangler secret delete RESEND_API_KEY
[ai]
binding = "AI"

# Hourly safety-net sweep of the crew-reports inbox (the email handler also processes on arrival).
[triggers]
crons = ["0 * * * *"]

# Production database (already live, holds the 97 crew).
[[d1_databases]]
binding = "DB"
database_name = "cims-hr-console"
database_id = "f0ac8b6a-deac-4214-8f42-e22b202d7d7d"
migrations_dir = "migrations"

# Daily Keyman board backup (spec §14.3). The hourly cron writes one dated CSV per day
# to this R2 bucket (off-D1 disaster-recovery snapshot). Free tier; a daily CSV is ~KB.
[[r2_buckets]]
binding = "EXPORTS"
bucket_name = "cims-hr-exports"

# ---- Staging: a separate Worker + separate D1 copy. Nothing reaches prod data
# that has not run green here first. Create the staging DB once with:
#   wrangler d1 create cims-hr-console-staging
# then paste its id below.
[env.staging]
name = "cims-hr-console-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cims-hr-console-staging"
database_id = "84ad4352-9979-4cd8-9bd2-fec887591257"
migrations_dir = "migrations"
